[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-anomaly-detection"
version = "0.1.0"
description = "Causal rolling Kronos forecast errors with per-feature POT thresholds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
kronos = ["torch>=2.0", "einops>=0.8", "huggingface_hub>=0.33", "tqdm>=4.67", "safetensors>=0.6"]
test = ["pytest>=8"]
experiments = ["scikit-learn>=1.6,<1.7", "matplotlib>=3.9,<3.10"]

[project.scripts]
kronos-ad = "kronos_ad.cli:main"

[tool.setuptools.packages.find]
include = ["kronos_ad*"]
